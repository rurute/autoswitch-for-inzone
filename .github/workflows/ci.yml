name: CI

# push と PR のたびに、ソリューション全体をビルドしてテストする。
# アプリは net10.0-windows（WinForms）なので Windows のランナーで走らせる。
# SDK のバージョンは global.json に合わせる。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution AutoSwitchForInzone.sln -c Release
